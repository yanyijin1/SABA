[build-system]
requires = ["setuptools>=61", "wheel"]

[project]
name = "SABA"
version = "1.0.0"
description = "Sample-Adaptive and Backbone-Aware Dropout for Time Series Forecasting"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "easy-torch==1.3.3",
    "easydict",
    "packaging",
    "setproctitle",
    "pandas",
    "scikit-learn",
    "tables",
    "sympy",
    "openpyxl",
    "numpy==1.24.4",
    "tqdm==4.67.1",
    "tensorboard==2.18.0",
    "transformers==4.40.1",
    "einops",
    "matplotlib"
]

[tool.setuptools]
package-dir = {"" = "src"}
